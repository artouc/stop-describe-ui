</style><text x="2" y="14" class="label">DESCRIBED</text><rect x="0.5" y="28.5" width="419" height="255" rx="10" class="card"/><rect x="24" y="52" width="372" height="36" rx="6" class="field"/><g transform="translate(36 62)"><g class="ico"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></g></g><text x="60" y="75" class="t m">Search all stores</text><text x="24" y="120" class="t m">Searches across all stores and shows the</text><text x="24" y="140" class="t m">results. Stores you don&#x27;t belong to are shown</text><text x="24" y="160" class="t m">as Operator, and every action records who did</text><text x="24" y="180" class="t m">what in which store. You can&#x27;t change</text><text x="24" y="200" class="t m">applications, payment methods, or plans, or</text><text x="24" y="220" class="t m">send messages to customers (replies,</text><text x="24" y="240" class="t m">approving or declining tentative</text><text x="24" y="260" class="t m">reservations).</text></svg>
