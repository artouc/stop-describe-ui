<svg xmlns="http://www.w3.org/2000/svg" width="420" height="199" viewBox="0 0 420 199" role="img" aria-labelledby="t"><title id="t">Toggle, described</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1f2328}
.label{font-size:12px;font-weight:600;fill:#656d76;letter-spacing:.04em}
.card{fill:#ffffff;stroke:#d0d7de}
.h1{font-size:20px;font-weight:600}
.h2{font-size:15px;font-weight:600}
.t{font-size:14px}
.m{fill:#656d76}
.strong{font-weight:600}
.btn{fill:#1f2328}
.btnt{fill:#ffffff;font-size:14px;font-weight:600}
.ico{fill:none;stroke:#656d76;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btnico{fill:none;stroke:#ffffff;stroke-width:1.75;stroke-linecap:round}
.on{fill:#1f883d}
.knob{fill:#ffffff}
.rule{stroke:#d8dee4}
.field{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.label,.m{fill:#8b949e}
.card{fill:#0d1117;stroke:#30363d}
.btn{fill:#e6edf3}
.btnt{fill:#0d1117}
.ico{stroke:#8b949e}
.btnico{stroke:#0d1117}
.on{fill:#238636}
.rule{stroke:#21262d}
.field{fill:#161b22;stroke:#30363d}
}
</style><text x="2" y="14" class="label">DESCRIBED</text><rect x="0.5" y="28.5" width="419" height="169" rx="10" class="card"/><text x="24" y="66" class="t strong">Auto-reply</text><rect x="360" y="51" width="36" height="20" rx="10" class="on"/><circle cx="386" cy="61" r="7.5" class="knob"/><text x="24" y="94" class="t m">Turning this off stops AI auto-replies and</text><text x="24" y="114" class="t m">web reservations. Customer messages are saved</text><text x="24" y="134" class="t m">only to the conversation log. You can turn it</text><text x="24" y="154" class="t m">back on anytime from &quot;Replies off&quot; in the</text><text x="24" y="174" class="t m">header.</text></svg>
